# PreDCC DFT settings (SOP Part II, sections 5-8): packaged defaults.
#
# Do not edit this file to configure a project. Run `predcc init <project>`
# and edit <project>/config/settings.toml instead: it is merged over these
# defaults, so it only needs the keys you change.
# Paths are relative to the project directory unless absolute.

[project]
molecules_dir = "molecules"     # one subdirectory per molecule (compound key)
jobs_dir = "jobs"               # SLURM manifests and array scripts per stage
derived_dir = "derived"         # generated tables; safe to delete and rebuild
experimental_dir = "experimental"  # measured K, one <reaction key>.toml each (SOP 2.5)

[inputs]
# CSV (name,smiles), .smi (SMILES name) or TOML ([[molecule]] name/smiles).
aldehydes = "inputs/aldehydes.txt"
amines = "inputs/amines.txt"

# ---------------------------------------------------------------- step 1
[specification]
allowed_elements = ["H", "C", "N", "O", "F", "S", "Cl", "Br"]
max_heavy_atoms = 30
max_rotatable_bonds = 10
max_reactive_sites = 2          # per input molecule; more sites -> rejected
strip_salts = true              # keep the largest fragment, record what was removed
neutralise = true               # protonated/deprotonated inputs -> neutral form, recorded
neutral_only = true             # net charge 0 after the above (nitro groups etc. are fine)

# Competing groups that make a molecule unsuitable. name = SMARTS.
[specification.aldehyde_exclude]
primary_amine = "[NX3H2][#6]"
hydrazine = "[NX3H2][NX3]"
aminooxy = "[NX3H2][OX2]"
ketone = "[#6][CX3](=O)[#6]"

[specification.amine_exclude]
aldehyde = "[CX3H1](=O)[#6]"
ketone = "[#6][CX3](=O)[#6]"

# ---------------------------------------------------------------- step 2
[products]
# Current benchmark: aldehyde + primary amine -> imine. The other classes are
# implemented; add any of "oxime", "hydrazone", "acylhydrazone", "azine".
linkages = ["imine"]
enumerate_ez = true             # both E and Z of every new C=N
acylhydrazone_rotamers = true   # syn and anti seeds about the amide C(O)-N bond
exchange_reactions = true       # generate TRN- reactions between condensates

# ---------------------------------------------------------------- step 3
[coordinates]
method = "ETKDGv4"
random_seed = 67
force_field = "MMFF94"          # MMFF94 clean-up; UFF used if MMFF lacks parameters
max_embed_attempts = 5

# ---------------------------------------------------------------- steps 4-5
[conformers]
# Step 5 engine: "censo" (CENSO drives ORCA internally) or "orca" (plain ORCA
# optimisation inputs + SLURM files for every CREST conformer, see [dft_opt]).
dft_engine = "censo"
solvent = "acetonitrile"
crest_ewin_kcal_mol = 3.0       # CREST energy window per seed
skip_crest_max_atoms = 4        # tiny species (water) go straight to CENSO
censo_rc = "censo2rc"           # config/censo2rc if present, else the packaged one
censo_parts = ["prescreening", "screening", "optimization"]

# Step 5 with dft_engine = "orca": optimise the pooled CREST conformers in ORCA,
# then re-rank by the DFT energy (CENSO ranks by G incl. mRRHO; this route by E).
[dft_opt]
keywords = "r2SCAN-3c Opt CPCM(acetonitrile) TightSCF"
blocks = ""
window_kcal_mol = 3.0           # GFN2-xTB window over the pooled CREST ensemble
max_conformers = 30
rank_window_kcal_mol = 3.0      # DFT window for passing conformers on to step 6

# ---------------------------------------------------------------- step 6
[frequencies]
window_kcal_mol = 2.0           # CENSO conformers within this of the lowest G get Opt+Freq
max_conformers = 10
keywords = "r2SCAN-3c TightOpt Freq CPCM(acetonitrile) TightSCF"
retry_keywords = "r2SCAN-3c VeryTightOpt Freq CPCM(acetonitrile) TightSCF"
retry_blocks = "%geom\n  Calc_Hess true\nend"
imaginary_tolerance_cm1 = 0.0   # any frequency below -tolerance fails
max_attempts = 2
temperature_k = 298.15

# ---------------------------------------------------------------- step 7
[sanity]
covalent_factor = 1.3           # rdDetermineBonds connectivity tolerance

# ---------------------------------------------------------------- step 8
[reference]
# Two-point CBS(3/4) extrapolation of DLPNO-CCSD(T), done in Python from two jobs.
# Verify keyword support for your ORCA version before the full run.
keywords_x = "DLPNO-CCSD(T) cc-pVTZ cc-pVTZ/C cc-pVTZ/JK RIJK TightPNO TightSCF"
keywords_y = "DLPNO-CCSD(T) cc-pVQZ cc-pVQZ/C cc-pVQZ/JK RIJK TightPNO TightSCF"
cardinal_x = 3
cardinal_y = 4
scf_alpha = 5.46                # E_SCF(X) = E_CBS + A exp(-alpha sqrt X)
corr_beta = 3.05                # E_corr(X) = E_CBS + B X^-beta
# Solvation free energy = E(model) - E(gas) at this level, on the same geometry,
# for every model in [solvation] of methods.toml (SMD, CPCM, ...; SOP 6.2).
solvation_keywords = "r2SCAN-3c TightSCF"
standard_state_correction = true  # +RT ln(24.46) per species (1 atm -> 1 M)
temperature_k = 298.15

# ---------------------------------------------------------------- step 9
[benchmark]
# Single points of methods.toml methods on each molecule's best geometry
# (gas phase; SOP 5.1 step 9). Select by level (functionals x basis sets,
# see [levels] in methods.toml) and/or by method label; both empty = all.
# `predcc level <name>` sets levels for one run without editing this file.
levels = []
methods = []

# ---------------------------------------------------------------- steps 10-11, 8
[analysis]
reference = "dlpno_ccsdt_cbs"   # label of the computed reference
solvation = "smd_mecn"          # solvation model used to rank methods vs DLPNO
bootstrap_samples = 2000        # 95 % CI on the MAE
bootstrap_seed = 67
# SOP 7: reactions with a species whose DLPNO T1 diagnostic exceeds this are
# flagged in errors.csv (t1_flag) and left out of method_ranking.csv.
t1_threshold = 0.02
# SOP 2.7/5.1 step 11: add G_ens - G_best (Boltzmann ensemble over the
# r2SCAN-3c conformers, E/Z isomers and rotamers) to every species' G.
ensemble_correction = true
# Parent reaction per linkage class for ddG (SOP 3), as "aldehyde name +
# amine name" or a CND- key. Unset classes use the first aldehyde in the
# input list with the first amine of that class.
[analysis.parents]
# imine = "benzaldehyde + aniline"

# ---------------------------------------------------------------- automation
[pipeline]
# `predcc run --submit` submits every ready stage, then a small driver job that
# reruns `predcc run --submit` once those jobs end, until nothing is left.
max_rounds = 30                 # safety stop for the self-resubmitting chain
max_submissions = 2             # per task folder; then it is reported, not resubmitted

# ---------------------------------------------------------------- SLURM
[slurm]
account = ""
partition = ""
array_limit = 50                # maximum simultaneous array tasks
modules = []                    # e.g. ["orca/6.0.1", "openmpi/4.1.6", "crest/3.0", "xtb/6.7"]
setup_lines = []                # e.g. ["source ~/venvs/predcc/bin/activate"]
scratch_root = ""               # e.g. "$TMPDIR"; empty = run ORCA in place

[slurm.stage.conformers]
cpus = 16
mem_per_cpu_mb = 2000
time = "24:00:00"

[slurm.stage.dft_opt]
cpus = 8
mem_per_cpu_mb = 3000
time = "12:00:00"

[slurm.stage.orca_input]        # one-off inputs from 'run_setup.py orca-input'
cpus = 8
mem_per_cpu_mb = 3000
time = "24:00:00"

[slurm.stage.frequencies]
cpus = 8
mem_per_cpu_mb = 3000
time = "24:00:00"

[slurm.stage.reference]
cpus = 16
mem_per_cpu_mb = 6000
time = "48:00:00"

[slurm.stage.benchmark]
cpus = 8
mem_per_cpu_mb = 4000
time = "24:00:00"

[slurm.stage.driver]            # the `predcc run --submit` job between rounds
cpus = 1
mem_per_cpu_mb = 2000
time = "01:00:00"
